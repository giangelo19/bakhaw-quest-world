<style>
/* A walkable Cancabato Bay shore. The world is one fixed illustration (flat shapes, one light source,
   soft shadows down-right); the interface around it follows the viewer's light or dark theme. */
:root{
  --bg:#2F7F8C; --panel:#FFFCF6; --panel-2:#EFE8DA; --ink:#1E2A2C; --muted:#5A6866; --line:#DDD3C2;
  --accent:#D9573A; --accent-ink:#FFFFFF; --gold:#E2A52A; --leaf:#3C8A4E; --leaf-soft:#DCEFDC; --bad:#B8402A;
  --scrim:rgba(18,30,32,.42); --shadow:0 1px 0 rgba(30,42,44,.06),0 10px 30px -12px rgba(20,32,34,.45);
  --sea:#2C8597; --sea-deep:#1C5A6C; --sea-soft:#CFE6E8; --gold-soft:#F7E6B5;
  --ruin:#B9B2A6; --ruin-2:#9E978C; --land:#E6D9BE; --sky:#E9F2F1; --good:#2F7D43;
  --display:'Bricolage Grotesque','Trebuchet MS','Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#123a41; --panel:#17252A; --panel-2:#223239; --ink:#EEF3EF; --muted:#A6B6B3; --line:#33464D;
    --accent:#FF8463; --accent-ink:#1B0D08; --gold:#F1C350; --leaf:#72C786; --leaf-soft:#1D3A28; --bad:#FF7B62;
    --sea:#55B8CB; --sea-deep:#2C7F93; --sea-soft:#183A44; --gold-soft:#3A3014;
    --ruin:#4E5452; --ruin-2:#3E4442; --land:#2A3230; --sky:#14262B; --good:#76D08A;
    --scrim:rgba(0,0,0,.55); --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#123a41; --panel:#17252A; --panel-2:#223239; --ink:#EEF3EF; --muted:#A6B6B3; --line:#33464D;
  --accent:#FF8463; --accent-ink:#1B0D08; --gold:#F1C350; --leaf:#72C786; --leaf-soft:#1D3A28; --bad:#FF7B62;
  --sea:#55B8CB; --sea-deep:#2C7F93; --sea-soft:#183A44; --gold-soft:#3A3014;
  --ruin:#4E5452; --ruin-2:#3E4442; --land:#2A3230; --sky:#14262B; --good:#76D08A;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow:hidden;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block}

/* edge-anchored interface */
div.edge{position:fixed;z-index:5;pointer-events:none}
div.edge > *{pointer-events:auto}
.tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.edge.tr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:min(300px,calc(100vw - 24px))}
.bc{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;justify-content:center;max-width:calc(100vw - 24px)}

<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const ui = $('#ui');
const W = 1800, H = 1200;
const S = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
const touch = matchMedia('(pointer:coarse)').matches;
const narrow = () => window.innerWidth <= 620;

/* the walking hint sits above the Talk button on touch and leaves after the first tap */
let hintEl = null;
function hideTouchHint(){ if (!hintEl) return; const e = hintEl; hintEl = null; e.classList.add('gone'); setTimeout(() => e.remove(), 600); }

/* ---------- sound ----------
   Everything is synthesised in the browser: no audio files, nothing to license,
   nothing to download. The score is tied to the quests, so the bay sounds like it
   is recovering as well as looking like it. */
const AUDIO = { ctx: null, master: null, music: null, sfx: null, toneFilter: null,
                on: { music: true, sfx: true }, started: false, recovery: 0 };
try { const saved = JSON.parse(localStorage.getItem('bakhaw-audio') || 'null'); if (saved) Object.assign(AUDIO.on, saved); } catch (e) {}
function saveAudio(){ try { localStorage.setItem('bakhaw-audio', JSON.stringify(AUDIO.on)); } catch (e) {} }

const MUSIC_VOL = 5.2, SFX_VOL = 1.6;
// pentatonic, so nothing can clash. Pitched up out of the range a phone speaker loses.
const PENT = [329.63, 392, 440, 493.88, 587.33, 659.25, 783.99];

function audioStart(){
  if (AUDIO.started) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  let ctx; try { ctx = new AC(); } catch (e) { return; }
  AUDIO.ctx = ctx; AUDIO.started = true;
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -5; limiter.knee.value = 6; limiter.ratio.value = 12;
  limiter.attack.value = 0.004; limiter.release.value = 0.18; limiter.connect(ctx.destination);
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(limiter);
  const music = ctx.createGain(); music.gain.value = AUDIO.on.music ? MUSIC_VOL : 0; music.connect(master);
  const sfx = ctx.createGain(); sfx.gain.value = AUDIO.on.sfx ? SFX_VOL : 0; sfx.connect(master);
  AUDIO.master = master; AUDIO.music = music; AUDIO.sfx = sfx;
  buildMusic();
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
}
function buildMusic(){
  const ctx = AUDIO.ctx, out = AUDIO.music;
  // one filter the whole score passes through: shut and muffled while the bay is ruined,
  // opening up a little with every quest finished
  const tf = ctx.createBiquadFilter(); tf.type = 'lowpass'; tf.frequency.value = 1300 + AUDIO.recovery * 520; tf.Q.value = 0.6; tf.connect(out);
  AUDIO.toneFilter = tf;
  // surf: filtered noise that swells and falls
  const len = Math.ceil(ctx.sampleRate * 4);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
  const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 480; bp.Q.value = 0.7;
  const washG = ctx.createGain(); washG.gain.value = 0.062;
  noise.connect(bp); bp.connect(washG); washG.connect(out); noise.start();
  const swell = ctx.createOscillator(); swell.frequency.value = 0.12;
  const swellG = ctx.createGain(); swellG.gain.value = 0.034;
  swell.connect(swellG); swellG.connect(washG.gain); swell.start();
  const drift = ctx.createOscillator(); drift.frequency.value = 0.07;
  const driftG = ctx.createGain(); driftG.gain.value = 180;
  drift.connect(driftG); driftG.connect(bp.frequency); drift.start();
  // a low drone in two voices
  [[110, 0.020], [164.81, 0.021], [220, 0.030], [329.63, 0.022]].forEach(([f, v], i) => {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = i % 2 ? 6 : -6;
    const g = ctx.createGain(); g.gain.value = v;
    o.connect(g); g.connect(tf); o.start();
  });
  // plucks, with gaps left in on purpose so it never turns into a tune you notice
  setInterval(() => {
    const c = AUDIO.ctx;
    if (!c || c.state !== 'running' || !AUDIO.on.music || Math.random() < 0.35) return;
    const lift = AUDIO.recovery, pool = PENT.slice(0, 4 + lift);
    pluck(pool[(Math.random() * pool.length) | 0], 0.088 + lift * 0.005);
    if (lift >= 3 && Math.random() < 0.3) pluck(pool[(Math.random() * pool.length) | 0] * 1.5, 0.028);
  }, 1500);
}
function pluck(freq, vol){
  const ctx = AUDIO.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  o.connect(g); g.connect(AUDIO.toneFilter); o.start(t); o.stop(t + 2.4);
}
function audioRecovery(n){
  AUDIO.recovery = n;
  if (!AUDIO.toneFilter) return;
  const t = AUDIO.ctx.currentTime;
  AUDIO.toneFilter.frequency.cancelScheduledValues(t);
  AUDIO.toneFilter.frequency.setTargetAtTime(1300 + n * 520, t, 2.5);
}
function beep(freq, dur, type, vol, slideTo){
  const ctx = AUDIO.ctx; if (!ctx || !AUDIO.on.sfx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AUDIO.sfx); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, freq, vol, q){
  const ctx = AUDIO.ctx; if (!ctx || !AUDIO.on.sfx) return;
  const n = Math.ceil(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1;
  const g = ctx.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(AUDIO.sfx); src.start(ctx.currentTime);
}
const SFX = {
  step(){ noiseBurst(0.09, 320 + Math.random() * 130, 0.045, 1.7); },
  tap(){ beep(660, 0.07, 'sine', 0.045); },
  page(){ beep(520, 0.09, 'triangle', 0.055, 700); },
  right(){ beep(587.33, 0.16, 'sine', 0.085); setTimeout(() => beep(880, 0.3, 'sine', 0.075), 110); },
  wrong(){ beep(150, 0.26, 'sine', 0.095, 96); noiseBurst(0.14, 220, 0.035, 1.2); },
  badge(){ [659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => beep(f, 0.45, 'triangle', 0.07), i * 110)); },
  restore(){ noiseBurst(1.1, 700, 0.045, 0.7); beep(196, 1.4, 'sine', 0.065, 392); }
};
function syncAudioBtn(sel, on, label){
  const b = $(sel); if (!b) return;
  b.classList.toggle('off', !on);
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.setAttribute('aria-label', label + (on ? ' on' : ' off'));
}
// any gesture unlocks audio, and iOS can suspend the context again later, so keep listening
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  audioStart();
  if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(() => {});
}, { passive: true }));


/* ---------- palette (the world is one fixed illustration) ---------- */
const C = {
  deep:'#2F7F8C', mid:'#3F97A0', shallow:'#6FBDB6', foam:'#E9F5EF',
  sand:'#EAD8B1', wet:'#D3BB8C', grass:'#A3BE6E', grass2:'#8DAE5B', grass3:'#B6CC85', path:'#DCC79C', pathEdge:'#C8B080',
  mud:'#B5A893', mud2:'#A39580', stump:'#7F6A55', dead:'#B9AF92',
  leaf:'#3E7C4B', leaf2:'#58985A', leaf3:'#2F6440', root:'#6B4E35', trunk:'#7A5A3A',
  thatch:'#C9A26B', thatch2:'#B08850', wall:'#E6CF9E', wall2:'#D2B680', wood:'#A27A52', red:'#C6573F', tin:'#AEBDC2', tarp:'#4E86B8', tarp2:'#3C6C97',
  white:'#F6F2E8', blue:'#2E6F9E', yellow:'#E9B949', shadow:'rgba(28,40,32,0.18)', ink:'#26302C'
};

/* ---------- deterministic random ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- geography ---------- */
const shoreY = x => 700 + 46 * Math.sin(x / 240) + 18 * Math.sin(x / 91 + 1.3) - 0.04 * (x - 900);
const PIER = { x: 1330, y0: 0, w: 46, len: 270 };   // y0 set from shore
PIER.y0 = shoreY(PIER.x) - 20;
const WALK = { x: 1640, w: 58, len: 220 }; WALK.y0 = shoreY(WALK.x) - 16;
const HALL = { x: 860, y: 250, w: 230, h: 120 };
const NURSERY = { x: 470, y: 470, w: 190, h: 110 };
const HOUSES = [ {x:110,y:300,w:96,h:70,r:'thatch'}, {x:250,y:250,w:110,h:76,r:'tin'}, {x:150,y:440,w:100,h:72,r:'tin'}, {x:300,y:400,w:92,h:66,r:'thatch'}, {x:1500,y:330,w:104,h:72,r:'tin'}, {x:1160,y:300,w:96,h:68,r:'thatch'} ];
const ROAD = [[30,560],[300,560],[560,600],[860,540],[1100,560],[1330,540],[1640,560],[1780,545]];
const PALMS = [[60,180],[420,200],[680,180],[1060,170],[1300,180],[1740,220],[700,420],[1150,455],[1740,420],[40,640],[1440,470]];
const NPCS = [
  { id:1, key:'ramon', x:PIER.x - 60, y:PIER.y0 + 6, name:'Mang Ramon', role:'Fisher', place:'the fish landing', look:{skin:'#9C6440',shirt:'#2C8597',pants:'#3A4A50',hair:'#5E5852',style:'short',acc:'salakot'} },
  { id:2, key:'elena', x:NURSERY.x + NURSERY.w / 2, y:NURSERY.y + NURSERY.h + 28, name:'Nanay Elena', role:'Mangrove nursery keeper', place:'the nursery', look:{skin:'#B97A52',shirt:'#3C8A4E',pants:'#5A4636',hair:'#77706A',style:'bun',acc:'none'} },
  { id:3, key:'luz', x:HALL.x + HALL.w / 2 + 40, y:HALL.y + HALL.h + 34, name:'Kapitana Luz', role:'Barangay captain', place:'the barangay hall', look:{skin:'#C68B5E',shirt:'#1C5A6C',pants:'#2B3438',hair:'#22191A',style:'long',acc:'none'} },
  { id:4, key:'joy', x:WALK.x + WALK.w / 2, y:WALK.y0 + WALK.len - 18, name:'Ate Joy', role:'Marine biology student', place:'the seagrass boardwalk', look:{skin:'#D7A27A',shirt:'#E2A52A',pants:'#2E5A6B',hair:'#2B211C',style:'long',acc:'glasses'} },
  { id:5, key:'berto', x:250, y:520, name:'Lolo Berto', role:'Retired boat builder', place:'the coastal homes', look:{skin:'#8E5B3B',shirt:'#8A6A48',pants:'#3F3A34',hair:'#ECE7DF',style:'short',acc:'none'} }
];
const PLAYER_LOOK = { skin:'#C68B5E', shirt:'#D9573A', pants:'#2F3B40', hair:'#2B211C', style:'short', acc:'cap', cap:'#2E6F9E' };

/* ---------- canvas helpers ---------- */
function mk(w, h, draw){ const c = document.createElement('canvas'); c.width = Math.ceil(w * S); c.height = Math.ceil(h * S); const g = c.getContext('2d'); g.scale(S, S); draw(g, w, h); return c; }
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function ell(g, x, y, rx, ry, col){ g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function circ(g, x, y, r, col){ g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }

/* ---------- the ground ---------- */
function drawGround(g){
  const R = rng(7);
  // sea, deep to shallow toward the shore
  g.fillStyle = C.deep; g.fillRect(0, 0, W, H);
  const band = (off, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, 0); for (let x = 0; x <= W; x += 10) g.lineTo(x, shoreY(x) + off); g.lineTo(W, 0); g.closePath(); g.fill(); };
  band(230, C.mid); band(120, C.shallow);
  // seagrass beds (sparse, ruined)
  for (let i = 0; i < 70; i++) { const x = 1470 + R() * 320, y = shoreY(x) + 70 + R() * 230; grassTuft(g, x, y, C.dead, 0.6); }
  band(30, '#A9CFC0');
  // mud flat along the mangrove belt
  const taper = x => { const a = Math.min(1, Math.max(0, (x - 0) / 120)), b = Math.min(1, Math.max(0, (1240 - x) / 220)); const t = Math.min(a, b); return t * t * (3 - 2 * t); };
  g.fillStyle = C.mud; g.beginPath(); g.moveTo(0, shoreY(0) - 12);
  for (let x = 0; x <= 1240; x += 10) g.lineTo(x, shoreY(x) - 12);
  for (let x = 1240; x >= 0; x -= 10) g.lineTo(x, shoreY(x) - 6 + (76 + 14 * Math.sin(x / 70)) * taper(x));
  g.closePath(); g.fill();
  for (let i = 0; i < 260; i++) { const x = 60 + R() * 1100, y = shoreY(x) + R() * 70 * taper(x); circ(g, x, y, 1 + R() * 2.2, C.mud2); }
  // land
  g.fillStyle = C.sand; g.beginPath(); g.moveTo(0, 0); for (let x = 0; x <= W; x += 10) g.lineTo(x, shoreY(x)); g.lineTo(W, 0); g.closePath(); g.fill();
  g.fillStyle = C.grass; g.beginPath(); g.moveTo(0, 0); for (let x = 0; x <= W; x += 10) g.lineTo(x, shoreY(x) - 70 - 14 * Math.sin(x / 130)); g.lineTo(W, 0); g.closePath(); g.fill();
  for (let i = 0; i < 520; i++) { const x = R() * W, y = R() * (shoreY(x) - 90); grassTuft(g, x, y, R() < 0.5 ? C.grass2 : C.grass3, 1); }
  // wet line and foam
  g.strokeStyle = C.wet; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); for (let x = 1120; x <= W; x += 10) { const y = shoreY(x) - 2; x === 1120 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  g.strokeStyle = C.foam; g.lineWidth = 3; g.beginPath(); for (let x = 1150; x <= W; x += 10) { const y = shoreY(x) + 9; x === 1150 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  // road
  g.lineCap = 'round'; g.lineJoin = 'round';
  const lines = [[ROAD, 52, 44],
    [[[HALL.x + HALL.w / 2, HALL.y + HALL.h], [HALL.x + HALL.w / 2, 548]], 44, 36],
    [[[PIER.x + PIER.w / 2, 545], [PIER.x + PIER.w / 2, PIER.y0 + 10]], 44, 36],
    [[[WALK.x + WALK.w / 2, 556], [WALK.x + WALK.w / 2, WALK.y0 + 8]], 40, 32],
    [[[NURSERY.x + NURSERY.w / 2, NURSERY.y + NURSERY.h], [NURSERY.x + NURSERY.w / 2, 585]], 44, 36],
    [[[250, 560], [250, 420], [180, 370]], 40, 32]];
  const stroke = (pts, wd, col) => { g.strokeStyle = col; g.lineWidth = wd; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); };
  lines.forEach(l => stroke(l[0], l[1], C.pathEdge)); lines.forEach(l => stroke(l[0], l[2], C.path));
  for (let i = 0; i < 140; i++) { const t = R(), seg = Math.floor(t * (ROAD.length - 1)), f = t * (ROAD.length - 1) - seg; const a = ROAD[seg], b = ROAD[seg + 1]; circ(g, a[0] + (b[0] - a[0]) * f + (R() - .5) * 30, a[1] + (b[1] - a[1]) * f + (R() - .5) * 26, 1.2 + R() * 1.6, C.pathEdge); }
  // mangrove stumps (ruined belt)
  const R2 = rng(21);
  for (let i = 0; i < 48; i++) { const x = 110 + i * 22.5 + R2() * 8, y = shoreY(x) + 8 + R2() * 52; stump(g, x, y); }
}
function grassTuft(g, x, y, col, s){ g.strokeStyle = col; g.lineWidth = 1.6 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 3 * s, y - 5 * s, x - 2 * s, y - 9 * s); g.moveTo(x + 3 * s, y); g.quadraticCurveTo(x + 3 * s, y - 6 * s, x + 5 * s, y - 10 * s); g.stroke(); }
function stump(g, x, y){ ell(g, x + 3, y + 3, 7, 3, C.shadow); g.fillStyle = C.stump; rr(g, x - 4, y - 8, 8, 10, 2); g.fill(); ell(g, x, y - 8, 4, 2, '#9C866E'); g.strokeStyle = C.stump; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x - 4, y); g.lineTo(x - 8, y + 4); g.moveTo(x + 4, y); g.lineTo(x + 8, y + 4); g.stroke(); }

/* ---------- objects (each its own sprite so the player can walk behind them) ---------- */
function houseArt(hw, hh, roof, broken){
  // the before and after have to differ in silhouette and in large areas of colour,
  // not in fine detail: at phone zoom a 6px line is invisible
  return mk(hw + 40, hh + 76, g => {
    const x = 15, y = 44, apex = y - 28;
    ell(g, x + hw / 2 + 8, y + hh + 4, hw / 2 + 10, 9, C.shadow);
    // stilts, one of them snapped and propped up with a pole
    g.fillStyle = broken ? '#8E7A5C' : C.wood;
    [x + 6, x + hw / 2 - 2, x + hw - 10].forEach((sx, i) => {
      if (broken && i === 2) { g.save(); g.translate(sx + 3, y + hh + 4); g.rotate(0.36); g.fillRect(-2, -16, 5, 16); g.restore(); }
      else g.fillRect(sx, y + hh - 10, 5, 14);
    });
    // walls: bleached and holed, or clean
    g.fillStyle = broken ? '#C2B290' : C.wall; rr(g, x, y + 8, hw, hh - 12, 3); g.fill();
    g.strokeStyle = broken ? '#A08B69' : C.wall2; g.lineWidth = 1.2;
    for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(x + 2, y + 8 + i * (hh - 12) / 6); g.lineTo(x + hw - 2, y + 8 + i * (hh - 12) / 6); g.stroke(); }
    if (broken) { g.fillStyle = '#443B32'; g.fillRect(x + 3, y + hh - 30, 15, 9); g.fillRect(x + hw - 21, y + 38, 12, 8); }

function approachSpot(q, px, py){
  const cands = [
    { x: q.x + 34, y: q.y + 6 }, { x: q.x - 34, y: q.y + 6 },
    { x: q.x, y: q.y - 28 }, { x: q.x, y: q.y + 36 },
    { x: q.x + 22, y: q.y + 28 }, { x: q.x - 22, y: q.y + 28 }
  ].filter(c => !blocked(c.x, c.y));
  if (!cands.length) return { x: q.x, y: q.y + 36 };
  cands.sort((a, b) => Math.hypot(a.x - px, a.y - py) - Math.hypot(b.x - px, b.y - py));

function blocked(x, y){
  if (x < 14 || x > W - 14 || y < 30 || y > H - 10) return true;
  if (y > shoreY(x) + 30 && !onDeck(x, y)) return true;   // mud flat edge is walkable a little
  for (const q of NPCS) if (Math.hypot(q.x - x, q.y - y) < 18) return true;
  for (const b of BLOCKS) if (x > b.x - 8 && x < b.x + b.w + 8 && y > b.y - 4 && y < b.y + b.h + 6) return true;

/* ===== MODEL-START (Quest 3: ten years of recovery) ===== */
const YEARS = 10;
const TYPHOONS = { 4: 0.55, 8: 0.9 };
function habitatOf(s){ return s.mature + 0.5 * s.young; }
function yieldOf(s){ return 0.55 * clamp(habitatOf(s) / 0.8) + 0.45 * s.sea; }
function initState(){
  const s = { year: 0, mature: 0.06, young: 0.02, div: 0.35, sea: 0.55, pol: 0.5, press: 0.6, income: 0, damage: null, shield: null, hist: [] };
  s.income = yieldOf(s); s.hist.push(snap(s)); return s;
}
function snap(s){ return { year: s.year, cover: s.mature + s.young, mature: s.mature, young: s.young, div: s.div, sea: s.sea, income: s.income, press: s.press, damage: s.damage, shield: s.shield }; }
// what actually stops a house being wrecked. Mature trees do the work, a mixed stand
// nearly doubles what they give, young trees count a quarter.
const SHIELD_WORTH = 0.98;
function stormShield(s){ return clamp(s.mature * (0.5 + 0.5 * s.div) + 0.25 * s.young); }
function damageIf(s, strength){ return clamp(strength * (1 - SHIELD_WORTH * stormShield(s))); }
function nextStorm(year){
  const ys = Object.keys(TYPHOONS).map(Number).filter(y => y > year).sort((a, b) => a - b);
  return ys.length ? { year: ys[0], strength: TYPHOONS[ys[0]] } : null;
}
const gauge = (l, v, c) => `<div class="g ${c || ''}"><span class="t"><span>${l}</span><b>${P(v)}</b></span><span class="tr"><i style="width:${P(v)}%"></i></span></div>`;
function step(s0, a){
  const s = Object.assign({}, s0, { hist: s0.hist.slice() });
  const n = k => a[k] || 0;
  s.year += 1; s.damage = null; s.shield = null;
  const room = clamp(1 - (s.mature + s.young));
  s.young += Math.min(room, 0.05 * n('plantDiverse') + 0.08 * n('plantFast'));
  s.div = clamp(s.div + 0.08 * n('plantDiverse') - 0.05 * n('plantFast'));
  s.press = clamp(s.press - 0.12 * n('guard') - 0.06 * n('support'), 0.08, 1);
  s.pol = clamp(s.pol - 0.12 * n('clean') + 0.03);
  const m = 0.30 * s.young; s.young -= m; s.mature += m;
  s.young += 0.05 * s.mature * clamp(1 - (s.mature + s.young));
  s.mature -= s.mature * 0.18 * s.press;
  s.young -= s.young * 0.40 * s.press;
  s.sea = clamp(s.sea + 0.10 * (1 - s.sea) * (1 - s.pol) - 0.07 * s.pol * s.sea + 0.005);
  const h = TYPHOONS[s.year];
  if (h) {
    const prot = stormShield(s);
    s.shield = prot;
    s.damage = h * (1 - SHIELD_WORTH * prot);
    const loss = h * 0.5 * (1 - 0.6 * s.div);
    s.mature -= s.mature * loss;
    s.young -= s.young * Math.min(1, loss * 1.3);
  }
  s.income = clamp(yieldOf(s) + 0.05 * n('support'));
  s.press = clamp(s.press + 0.45 * (0.45 - s.income), 0.08, 1);
  s.div = clamp(s.div - 0.02 * s.press + 0.02 * s.mature);
  s.hist.push(snap(s));
  return s;
}
function verdict(s){
  const cover = s.mature + s.young;
  if (s.mature >= 0.40 && s.press <= 0.40) return s.div >= 0.40 ? 'recovered' : 'brittle';
  if (cover < 0.20 || s.press > 0.65) return 'spiral';
  return 'fragile';
}
/* ===== Quest 5: the web ===== */
const NODES = [
  { id:'mg', label:'Mangroves', x:250, y:105 }, { id:'sg', label:'Seagrass', x:410, y:95 },
  { id:'nf', label:'Fish nursery', x:330, y:190 }, { id:'sh', label:'Shellfish', x:540, y:175 },
  { id:'sb', label:'Shorebirds', x:90, y:150 }, { id:'dt', label:'Nutrient cycling', x:170, y:235 },
  { id:'gf', label:'Leyte Gulf fish', x:270, y:305 }, { id:'ff', label:'Fisherfolk', x:450, y:280 },
  { id:'hh', label:'Coastal homes', x:90, y:310 }, { id:'lg', label:'Local governance', x:330, y:35 }
];
const EDGES = [
  ['mg','nf'],['mg','sg'],['mg','hh'],['mg','sb'],['mg','dt'],['mg','lg'],
  ['sg','nf'],['sg','sh'],['sg','dt'],['nf','gf'],['nf','ff'],['gf','ff'],
  ['ff','sh'],['ff','hh'],['ff','lg'],['hh','lg']
];
function degrees(){ const d = {}; NODES.forEach(n => d[n.id] = 0); EDGES.forEach(e => { d[e[0]]++; d[e[1]]++; }); return d; }
function integrity(removed){
  const alive = NODES.map(n => n.id).filter(id => !removed.has(id));
  const seen = new Set(); let best = 0;
  alive.forEach(id => {
    if (seen.has(id)) return;
    let size = 0; const stack = [id]; seen.add(id);
    while (stack.length) {
      const c = stack.pop(); size++;
      EDGES.forEach(e => { const o = e[0] === c ? e[1] : e[1] === c ? e[0] : null;
        if (o && !removed.has(o) && !seen.has(o)) { seen.add(o); stack.push(o); } });
    }
    best = Math.max(best, size);
  });
  return best / NODES.length;
}
function targetedRemoval(protectedSet, k){
  const d = degrees();
  return new Set(NODES.map((n, i) => ({ id: n.id, i, deg: d[n.id] }))
    .filter(n => !protectedSet.has(n.id))
    .sort((a, b) => b.deg - a.deg || a.i - b.i)
    .slice(0, k).map(n => n.id));
}
function randomRemovalMean(protectedSet, k, trials){
  const pool = NODES.map(n => n.id).filter(id => !protectedSet.has(id));
  let sum = 0;
  for (let t = 0; t < trials; t++) {
    const p = pool.slice(), rem = new Set();
    for (let j = 0; j < k && p.length; j++) rem.add(p.splice(Math.floor(Math.random() * p.length), 1)[0]);
    sum += integrity(rem);
  }
  return sum / trials;
}

/* ---------- sorting game (Quests 1 and 2) ---------- */
function sorter(el, cfg, onDone){
  let i = 0, miss = 0, placed = {}, tried = {};
  cfg.bins.forEach(b => placed[b.id] = []);
  function draw(msg){
    const c = cfg.cards[i];
    let h = `<p class="task"><span class="tico">!</span><span>${cfg.task}</span></p>`;
    if (c) h += `<div class="sc-now"><span class="muted small">Card ${i + 1} of ${cfg.cards.length}</span><div class="sc"><span class="emo" aria-hidden="true">${c.emo}</span><span>${c.text}</span></div></div>`;
    else h += '<p class="muted">All sorted.</p>';
    h += '<div aria-live="polite">' + (msg || '') + '</div>';
    h += '<div class="bins" role="group" aria-label="Choose a box">';
    cfg.bins.forEach(b => {
      const hint = cfg.hint && c && c.bin === b.id, no = c && tried[b.id];
      h += `<button class="bin${hint ? ' hint' : ''}" data-b="${b.id}" style="--c:${b.c}" ${!c || no ? 'disabled' : ''}><span class="bh"><b>${b.name}</b><span>${b.sign}</span></span>${placed[b.id].length ? `<span class="placed">${placed[b.id].join(' · ')}</span>` : ''}</button>`;
    });
    h += '</div>';
    el.innerHTML = h;
    $$('.bin', el).forEach(b => b.onclick = () => drop(b.dataset.b));
  }
  function drop(bid){
    const c = cfg.cards[i]; if (!c) return;
    if (c.bin === bid) {
      SFX.right();
      placed[bid].push(c.short || c.text); i++; tried = {};
      draw(`<div class="toast"><b>Correct.</b><span>${c.why}</span></div>`);
      if (i >= cfg.cards.length) onDone(miss);
    } else {
      SFX.wrong(); miss++; tried[bid] = true;
      const b = cfg.bins.find(x => x.id === bid);
      draw(`<div class="toast bad"><b>Not ${b.name.toLowerCase()}.</b><span>${c.nudge || 'Ask who gains and who loses in this pair, then try again.'}</span></div>`);
      const card = $('.sc', el); if (card) card.classList.add('shake');
    }
  }
  draw();
}
function choice(el, q, opts, ans, right, wrong, onDone){
  let tries = 0;
  function draw(msg, picked){
    let h = `<p class="task"><span class="tico">?</span><span>${q}</span></p><div class="opts">`;

/* ---------- the quest flow, shown over the walkable shore ---------- */
const STEP_NAMES = ['Talk', 'Learn', 'Practice', 'Challenge', 'Reward'];
function talk(n){ openQuest(n, 0); }
function openQuest(n, stepI, extra){
  const q = QUESTS[n - 1], who = NPCS.find(p => p.id === n);
  stepI = stepI || 0;
  openUI(`<div class="qhead">
      <div class="qtop"><span class="kick">Quest ${n} · ${q.part}</span><button class="btn soft sm" id="qleave">Leave</button></div>
      <h2>${q.title}</h2>
      <ol class="steps" aria-label="Quest steps">${STEP_NAMES.map((s, i) => `<li class="${i === stepI ? 'on' : i < stepI ? 'past' : ''}"${i === stepI ? ' aria-current="step"' : ''}>${s}</li>`).join('')}</ol>
      <div class="qnpc"><img src="${who.portrait}" alt=""><span><b>${who.name}</b><br><span class="rl">${who.role}</span></span></div>
    </div><div class="stage" id="qstage"></div>`, true, true);
  $('#qleave').onclick = () => leaveQuest(n);
  const st = $('#qstage');
  if (stepI === 0) {
    let i = 0;
    const drawTalk = () => {
      st.innerHTML = `<p class="line">${q.talk[i]}</p><div class="pips" aria-hidden="true">${q.talk.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
        <div class="row"><button class="btn" id="nx">${i < q.talk.length - 1 ? 'Next' : 'Accept the quest'}</button>${i > 0 ? '<button class="btn soft sm" id="pv">Back</button>' : ''}</div>`;
      $('#nx', st).onclick = () => { if (i < q.talk.length - 1) { i++; drawTalk(); $('#nx', st).focus(); } else openQuest(n, 1); };
      const pv = $('#pv', st); if (pv) pv.onclick = () => { i--; drawTalk(); };
    };
    drawTalk();
  } else if (stepI === 1) {
    st.innerHTML = q.learn() + '<div class="row"><button class="btn" id="nx">I\'m ready to practice</button></div>';
    $('#nx', st).onclick = () => openQuest(n, 2);
  } else if (stepI === 2) {
    st.innerHTML = '<div id="pr" class="stage"></div><div class="row" id="prn"></div>';
    q.practice($('#pr', st), () => { $('#prn', st).innerHTML = '<button class="btn" id="nx">Start the challenge</button>'; $('#nx', st).onclick = () => openQuest(n, 3); });
  } else if (stepI === 3) {
    st.innerHTML = '<div id="ch" class="stage"></div>';
    q.challenge($('#ch', st), (got, summary) => {
      const before = state.stars[n] || 0;
      state.stars[n] = Math.max(before, got);
      updateMeter();
      openQuest(n, 4, { got: state.stars[n], gained: Math.max(0, state.stars[n] - before) * 100, summary });
    });
  } else {
    const e = extra || { got: state.stars[n] || 0, gained: 0 };
    const nq = QUESTS.find(x => !(state.stars[x.n] > 0));
    st.innerHTML = `<div class="card reward">${qbadge(q)}<span class="kick">Badge earned</span><h2>${q.badgeName}</h2>${stars(e.got)}${e.summary ? `<span class="muted">${esc(e.summary)}</span>` : ''}<span class="xp">+${e.gained} XP</span>
      <p><b>${who.name}:</b> Salamat! ${q.place.charAt(0).toUpperCase() + q.place.slice(1)} is coming back to life.</p>

      vx /= len; vy /= len;
      const nx = P.x + vx * sp, ny = P.y + vy * sp; let moved = false;
      if (!blocked(nx, P.y)) { P.x = nx; moved = true; }
      if (!blocked(P.x, ny)) { P.y = ny; moved = true; }
      if (!moved && this.target) { this.target = null; if (this.pendingTalk && Math.hypot(this.pendingTalk.x - P.x, this.pendingTalk.y - P.y) < 90) { const t = this.pendingTalk; this.pendingTalk = null; talk(t.id); } }
      P.dir = Math.abs(vx) > Math.abs(vy) ? 'side' : vy < 0 ? 'up' : 'down';
      P.setFlipX(P.dir === 'side' && vx < 0);
      P.t += dt; const f = Math.floor(P.t / 140) % 4; P.setTexture(`pl-${P.dir}-${f === 1 ? 1 : f === 3 ? 2 : 0}`);
      this.stepT = (this.stepT || 0) + dt;
      if (this.stepT >= 300) { this.stepT = 0; SFX.step(); }
    } else { P.t = 0; this.stepT = 260; P.setTexture(`pl-${P.dir}-0`); }
    P.setDepth(P.y);
    // nearest neighbour
    let near = null, best = touch ? 92 : 80;
    NPCS.forEach(p => { const d = Math.hypot(p.x - P.x, p.y - P.y); if (d < best) { best = d; near = p; } p.spr.setFlipX(P.x < p.x && d < 160); p.spr.setTexture(d < 160 ? `${p.key}-side-0` : `${p.key}-down-0`); });
    if (near !== state.near) {
      state.near = near; const b = $('#talkbtn');
      // on a phone the bottom row is map | Talk | zoom, so the button keeps its name off
      if (near) { $('#talklabel').textContent = narrow() ? 'Talk' : `Talk to ${near.name}`; b.hidden = false; } else b.hidden = true;
    }
    this.syncMap();
  }
}
$('#talkbtn').onclick = () => { if (state.near && !state.open) talk(state.near.id); };
$('#widebtn').onclick = () => { if (scene) scene.setWide(scene.cameras.main.zoom > scene.baseZoom() * 0.8); };
$('#musicbtn').onclick = () => {
  AUDIO.on.music = !AUDIO.on.music; saveAudio(); audioStart();
  if (AUDIO.music) AUDIO.music.gain.setTargetAtTime(AUDIO.on.music ? MUSIC_VOL : 0, AUDIO.ctx.currentTime, 0.25);
  syncAudioBtn('#musicbtn', AUDIO.on.music, 'Music');
};
$('#sfxbtn').onclick = () => {
  AUDIO.on.sfx = !AUDIO.on.sfx; saveAudio(); audioStart();
  if (AUDIO.sfx) AUDIO.sfx.gain.setTargetAtTime(AUDIO.on.sfx ? SFX_VOL : 0, AUDIO.ctx.currentTime, 0.1);
  syncAudioBtn('#sfxbtn', AUDIO.on.sfx, 'Sound effects');
};
syncAudioBtn('#musicbtn', AUDIO.on.music, 'Music');
syncAudioBtn('#sfxbtn', AUDIO.on.sfx, 'Sound effects');
if (touch) { document.querySelectorAll('.kb').forEach(k => k.remove()); hintEl = $('#touchhint'); }
else { const th = $('#touchhint'); if (th) th.remove(); }

function boot(){
  new Phaser.Game({ type: Phaser.AUTO, parent: 'game', backgroundColor: C.deep, scale: { mode: Phaser.Scale.RESIZE, width: window.innerWidth, height: window.innerHeight }, render: { antialias: true }, banner: false, scene: Shore });
}
const fontsReady = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('700 11px "Atkinson Hyperlegible"')]), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(boot, boot);
})();
</script>
